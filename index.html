/* ============================================================
   14. ACTIONS
   ============================================================ */
const ACTIONS={
  home(){
    // clear the share hash too, otherwise a refresh drops them back into the
    // guest or vendor view they just exited
    if(location.hash) history.replaceState(null,'',location.pathname+location.search);
    view=(session&&S.onboarded)?'dash':'landing'; guestCtx=null; render();
  },

  /* accounts */
  goAuth(e,el){ authMode=el.dataset.mode||'in'; authMsg=''; view='auth'; render() },
  authSwitch(){ authMode=authMode==='up'?'in':'up'; authMsg=''; render() },
  async signOut(){
    await supa.auth.signOut();
    session=null; view='landing'; render();
    toast('Signed out','ok');
  },

  demo(){ loadDemo(); toast('Demo property loaded','ok') },
  exitDemo(){ if(confirm('Clear the demo data and start with an empty account?')){ S=blankState(); wizDraft=newDraft(); wizStep=0; view='wizard'; commit() } },
  guestPortal(){ guestCtx=guestCtx||{name:'',email:'',title:'',body:'',trade:'',urgency:'normal',propId:S.activeProp};
                 view='guest'; render() },
  toggleMenu(){ document.getElementById('sb').classList.toggle('open') },
  closeModal, modalBg(e,el){ if(e.target===el) closeModal() },

  /* wizard */
  startWizard(){ wizDraft=newDraft(); wizStep=0; view='wizard'; render() },
  cancelWiz(){ wizDraft=null; view=S.onboarded?'props':'landing'; render() },
  wizBack(){ if(wizStep>0){wizStep--; render()} },
  wizNext(){
    if(wizStep===0){
      if(!wizDraft.address.trim()&&!wizDraft.nickname.trim()){ return toast('Give the property a nickname or address','bad') }
      if(!wizDraft.nickname.trim()) wizDraft.nickname=wizDraft.address.split(',')[0];
    }
    wizStep++; render();
  },
  /* Skipping is a first-class choice, not a failure. Jump straight past the
     details step; the missing fields get tracked and nagged about instead. */
  wizSkipAppl(){ wizStep=GROUPS.length+2; render(); toast('Skipped. You will be reminded to finish this.') },
  wizAddVendor(){ wizMode=true; vendorModal(null) },
  wizDelVendor(e,el){ wizDraft.vendors.splice(+el.dataset.i,1); render() },
  wizFinish(){
    const d=wizDraft;
    S.properties.push({id:d.id,nickname:d.nickname,address:d.address,type:d.type,beds:d.beds,
      year:d.year,baseline:d.baseline,systems:d.systems,skipped:[],created:d.created});
    // Create a record for every selected appliance even when the details were
    // skipped, so the app can keep track of what is still missing.
    d.systems.filter(k=>APPLIANCE_KEYS[k]).forEach(k=>{
      const a=d.appliances.find(x=>x.key===k)||{};
      S.appliances.push({id:uid(),propId:d.id,key:k,brand:a.brand||'',model:a.model||'',year:a.year||''});
    });
    d.vendors.forEach(v=>S.vendors.push({...v,id:uid()}));
    S.activeProp=d.id; S.onboarded=true; wizDraft=null; wizStep=0; view='dash';
    // First property ever: walk the owner through the app. Marked as seen
    // up front so a reload mid-tour does not start it again.
    if(!S.toured){ S.toured=true; tour=0 }
    commit();
    // The tour's first card already says the schedule is ready.
    if(tour===null) toast('Schedule built','ok');
  },

  /* quick tour */
  tourStart(){ tourGo(0) },
  tourNext(){ if(tour===null) return; if(tour>=TOUR.length-1) return ACTIONS.tourEnd(true); tourGo(tour+1) },
  tourBack(){ if(tour>0) tourGo(tour-1) },
  tourEnd(finished){
    tour=null; view='dash'; render(); window.scrollTo(0,0);
    toast(finished===true?'You are all set':'Tour closed. You can replay it from Settings.','ok');
  },

  /* nav + filters */
  switchProp(e,el){ S.activeProp=el.value; commit() },
  setActive(e,el){ S.activeProp=el.dataset.id; view='dash'; commit() },
  schFilter(e,el){ schFilter=el.dataset.k; render() },
  schView(e,el){ schView=el.dataset.k; if(schView==='list') schFilter='all'; view='sched'; render(); window.scrollTo(0,0) },
  schCat(e,el){ schCat=el.dataset.k; view='schcat'; render(); window.scrollTo(0,0) },
  setStatus(e,el){
    const p=activeProp(), id=el.dataset.id, v=el.value;
    const t=buildSchedule(p.id).find(x=>x.ruleId===id); if(!t) return;
    S.taskStatus=S.taskStatus||{};
    const key=p.id+'|'+id;
    if(v==='done'){ el.value=workStatus(p.id,t); return completeModal(id) }  // capture date, cost, vendor
    if(v==='todo') delete S.taskStatus[key]; else S.taskStatus[key]={s:v,due:iso(t.due)};
    commit(); toast(v==='progress'?'Marked in progress':'Marked not started');
  },

  /* tasks */
  complete(e,el){ completeModal(el.dataset.id) },
  logDone(){ const p=activeProp(); const s=buildSchedule(p.id); if(s.length) completeModal(s[0].ruleId) },
  saveComplete(){
    const p=activeProp();
    S.completions.push({id:uid(),propId:p.id,ruleId:val('crule'),date:val('cdate'),
      cost:val('ccost'),vendorId:val('cvendor'),note:val('cnote')});
    if(S.taskStatus) delete S.taskStatus[p.id+'|'+val('crule')];  // next occurrence starts fresh
    closeModal(); commit(); toast('Logged. Next occurrence scheduled.','ok');
  },
  snooze(e,el){
    const p=activeProp(), id=el.dataset.id;
    const t=buildSchedule(p.id).find(x=>x.ruleId===id); if(!t) return;
    // record a pseudo-completion 30 days before the new target so the next due lands +30d
    S.completions.push({id:uid(),propId:p.id,ruleId:id,snoozed:true,
      date:iso(addMonths(new Date(today().getTime()+30*MS_DAY),-t.every)),note:'Snoozed'});
    commit(); toast('Pushed out 30 days');
  },
  addCustom(){ customModal() },
  saveCustom(){
    const name=val('cname'); if(!name) return toast('Name the task','bad');
    const every=+val('cevery');
    const p=activeProp();
    const rid='c_'+uid();
    S.custom.push({id:rid,propId:p.id,n:name,every,trade:val('ctrade'),why:val('cwhy')});
    // anchor so the first due date is what the user picked
    S.completions.push({id:uid(),propId:p.id,ruleId:rid,date:iso(addMonths(pd(val('cdue')),-every)),note:'Initial'});
    closeModal(); commit(); toast('Added to schedule','ok');
  },

  /* walkthroughs */
  newWalk(){ walkModal() },
  saveWalk(){
    const p=activeProp(); if(!p) return;
    const items=buildChecklist(p);
    if(!items.length) return toast('This property has no checklist items yet','bad');
    const w={id:uid(),propId:p.id,vendorId:val('wvendor'),started:val('wdate')||iso(today()),
             completed:'',status:'open',items};
    S.walkthroughs.unshift(w);
    S.activeWalk=w.id; view='walkdetail';
    closeModal(); commit(); toast(items.length+' item checklist ready','ok');
  },
  openWalk(e,el){ S.activeWalk=el.dataset.id; view='walkdetail'; commit() },
  backToWalks(){ view='walk'; commit() },
  wtSet(e,el){
    const w=S.walkthroughs.find(x=>x.id===S.activeWalk); if(!w) return;
    const i=w.items.find(x=>x.id===el.dataset.id); if(!i) return;
    // clicking the active state again clears it, so a misclick is recoverable
    i.status = i.status===el.dataset.v ? '' : el.dataset.v;
    commit();
  },
  wtDelPhoto(e,el){
    const w=S.walkthroughs.find(x=>x.id===S.activeWalk); if(!w) return;
    const i=w.items.find(x=>x.id===el.dataset.id); if(!i) return;
    i.photo=''; commit();
  },
  lightbox(e,el){ lightboxModal(el.dataset.src) },
  finishWalk(e,el){
    const w=S.walkthroughs.find(x=>x.id===el.dataset.id); if(!w) return;
    const pr=wtProgress(w);
    if(pr.done<pr.total&&!confirm((pr.total-pr.done)+' items are still unchecked. Complete the walkthrough anyway?')) return;
    w.status='complete'; w.completed=iso(today());
    const fl=wtFlags(w);
    // A finished walkthrough is real evidence the inspection happened, so log it
    // against the schedule. Otherwise the app would still nag for a walkthrough
    // the owner just spent an hour doing.
    S.completions.push({id:uid(),propId:w.propId,ruleId:'walkthru',date:w.completed,cost:'',
      note:fl.length?fl.length+' items flagged for attention':'No issues found'});
    commit();
    toast(fl.length?`Complete. ${fl.length} item${fl.length===1?'':'s'} flagged.`:'Complete. Nothing flagged.','ok');
  },
  delWalk(e,el){
    if(!confirm('Delete this walkthrough and its photos and notes?')) return;
    S.walkthroughs=S.walkthroughs.filter(w=>w.id!==el.dataset.id);
    if(S.activeWalk===el.dataset.id){ S.activeWalk=null; view='walk' }
    commit();
  },
  copyWalkLink(e,el){
    const url=location.origin+location.pathname+'#walk/'+el.dataset.id;
    navigator.clipboard.writeText(url).then(()=>toast('Vendor link copied','ok'),()=>toast('Copy failed','bad'));
  },

  /* vendors */
  addVendor(){ wizMode=false; vendorModal(null) },
  editVendor(e,el){ wizMode=false; vendorModal(S.vendors.find(v=>v.id===el.dataset.id)) },
  delVendor(e,el){ S.vendors=S.vendors.filter(v=>v.id!==el.dataset.id); commit() },
  saveVendor(e,el){
    const name=val('vname'); if(!name) return toast('Vendor needs a name','bad');

    if(el.dataset.wiz==='1'){ wizDraft.vendors.push(obj); closeModal(); render(); }
    else{
      const i=S.vendors.findIndex(v=>v.id===obj.id);
      if(i>=0) S.vendors[i]=obj; else S.vendors.push(obj);
      closeModal(); commit();
    }

  /* appliances */
  addAppl(){ applianceModal(null) },
  editAppl(e,el){ applianceModal(S.appliances.find(a=>a.id===el.dataset.id)) },
  saveAppl(){

    const i=S.appliances.findIndex(a=>a.id===obj.id);

    closeModal(); commit(); toast('Saved','ok');
  },

  /* properties */
  delProp(e,el){
    const id=el.dataset.id;
    if(!confirm('Delete this property and all its records?')) return;
    S.properties=S.properties.filter(p=>p.id!==id);
    S.appliances=S.appliances.filter(a=>a.propId!==id);
    S.completions=S.completions.filter(c=>c.propId!==id);
    S.requests=S.requests.filter(r=>r.propId!==id);
    S.custom=S.custom.filter(c=>c.propId!==id);
    S.walkthroughs=S.walkthroughs.filter(w=>w.propId!==id);
    if(S.activeProp===id) S.activeProp=S.properties[0]?S.properties[0].id:null;
    if(!S.properties.length){ S.onboarded=false; view='landing' }

  },

  /* requests */
  submitReq(){
    const g=guestCtx;

    const propId=g.propId||S.activeProp||(S.properties[0]&&S.properties[0].id);

    S.requests.unshift({id:uid(),propId,guestName:g.name,guestEmail:g.email,title:g.title,

    commit(); toast('Sent. The owner has been notified.','ok');
  },
  advReq(e,el){ reqModal(el.dataset.id) },
  saveReq(){
    const r=S.requests.find(x=>x.id===val('rid'));

  },
  delReq(e,el){ S.requests=S.requests.filter(r=>r.id!==el.dataset.id); commit() },

  /* settings */
  toggleDigest(){ S.prefs.emailDigest=!S.prefs.emailDigest; commit() },
  preview(){ digestPreview() },
  copyLink(){ const i=document.getElementById('portalLink'); i.select();
    navigator.clipboard.writeText(i.value).then(()=>toast('Link copied','ok'),()=>toast('Copy failed','bad')) },
  wipe(){ if(confirm('Erase all PropertyPulse data in this browser?')){ DB.clear(); S=blankState(); view='landing'; render() } },
  exportJson(){ dl('propertypulse-data.json',JSON.stringify(S,null,2),'application/json') },
  exportCsv(){
    const p=activeProp(); if(!p) return;
    const rows=[['Task','Frequency','Due date','Status','Days','Last done','Trade','Suggested vendor']];
    buildSchedule(p.id).forEach(t=>{const v=suggestVendors(t.trade);
      rows.push([t.name,everyLabel(t.every),fmt(t.due),t.status,t.days,t.lastDone?fmt(t.lastDone):'never',
                 TRADES[t.trade]||'self',v[0]?v[0].name:''])});
    dl('maintenance-schedule.csv',rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');
  },
};

function val(id){const e=document.getElementById(id);return e?e.value.trim():''}
function dl(name,data,type){
  const b=new Blob([data],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
  toast('Downloaded '+name,'ok');
}

   ============================================================ */
function bind(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    view=b.dataset.nav; const sb=document.getElementById('sb'); if(sb)sb.classList.remove('open'); render();
  });
  document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.opt;
    const i=wizDraft.systems.indexOf(k);
    if(i>=0) wizDraft.systems.splice(i,1); else wizDraft.systems.push(k);
    render();
  });
  document.querySelectorAll('[data-d]').forEach(el=>{
    el.oninput=()=>{ wizDraft[el.dataset.d]=el.value };
    el.onchange=()=>{ wizDraft[el.dataset.d]=el.value };
  });
  document.querySelectorAll('[data-ap]').forEach(el=>{
    el.oninput=()=>{
      const k=el.dataset.ap;
      let a=wizDraft.appliances.find(x=>x.key===k);
      if(!a){ a={key:k,brand:'',model:'',year:''}; wizDraft.appliances.push(a) }
      a[el.dataset.fld]=el.value;
    };
  });
  document.querySelectorAll('[data-g]').forEach(el=>{
    const h=()=>{ guestCtx[el.dataset.g]=el.value };
    el.oninput=h; el.onchange=h;
  });
  document.querySelectorAll('[data-s]').forEach(el=>{
    el.onchange=()=>{ if(el.dataset.s==='ownerEmail'){ S.owner.email=el.value; DB.save(S) } };
  });
  /* Walkthrough notes save on the fly. Re-rendering on every keystroke would
     steal focus mid-sentence, so write straight to state and save without
     touching the DOM. The value is already correct on the next render. */
  document.querySelectorAll('[data-wtnote]').forEach(el=>{
    el.oninput=()=>{
      const w=S.walkthroughs.find(x=>x.id===S.activeWalk); if(!w) return;
      const i=w.items.find(x=>x.id===el.dataset.wtnote); if(!i) return;
      i.note=el.value; DB.save(S);
    };
  });
  document.querySelectorAll('[data-wtphoto]').forEach(el=>{
    el.onchange=async()=>{
      const f=el.files&&el.files[0]; if(!f) return;
      const w=S.walkthroughs.find(x=>x.id===S.activeWalk); if(!w) return;
      const i=w.items.find(x=>x.id===el.dataset.wtphoto); if(!i) return;
      try{
        i.photo=await compressImage(f);
        // an unchecked item with a photo attached is almost always a problem
        if(!i.status) i.status='attention';
        commit(); toast('Photo attached','ok');
      }catch(err){
        toast('Could not read that image','bad');
      }
    };
  });
  const af=document.getElementById('authForm');
  if(af) af.onsubmit=submitAuth;
  bindDates(document);
  bindActions(document);
}

/* Sign in and sign up are the same form with one branch, because everything
   around them — reading the fields, the busy state, the error handling — is
   identical, and two copies would drift apart. */
async function submitAuth(e){
  e.preventDefault();
  if(authBusy) return;
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPass').value;
  authBusy=true; authMsg=''; render();

  try{
    if(authMode==='up'){
      const {data,error}=await supa.auth.signUp({email,password});
      if(error) throw error;
      /* If the project requires email confirmation, signUp returns a user but
         no session. Saying "check your email" only when that is actually true
         avoids sending someone to an inbox that will stay empty. */
      if(!data.session){
        authBusy=false; authMode='in';
        authMsg='Check your email to confirm the address, then sign in.';
        return render();
      }
      session=data.session;
    }else{
      const {data,error}=await supa.auth.signInWithPassword({email,password});
      if(error) throw error;
      session=data.session;
    }
  }catch(err){
    authBusy=false;
    authMsg=err&&err.message?err.message:'Could not sign in. Try again.';
    return render();
  }

  authBusy=false;
  afterSignIn();
}

/* One place to land a signed-in user, used by both the form and the boot
   check, so a fresh sign-in and a returning visitor behave the same. */
function afterSignIn(){
  if(session&&session.user&&session.user.email&&!S.owner.email){
    S.owner.email=session.user.email;
    DB.save(S);
  }
  view=S.onboarded?'dash':'wizard';
  if(view==='wizard'&&!wizDraft){ wizDraft=newDraft(); wizStep=0 }
  render();
  toast('Signed in','ok');
}
function bindActions(scope){
  scope.querySelectorAll('[data-a]').forEach(el=>{
    const fn=ACTIONS[el.dataset.a]; if(!fn) return;
    if(el.tagName==='SELECT') el.onchange=e=>fn(e,el);
    else el.onclick=e=>fn(e,el);
  });
}
const mo=new MutationObserver(()=>{ bindActions(MR); bindDates(MR) });
mo.observe(MR,{childList:true});

/* Shared links have to work whether the app is cold or already open. Routing on
   hashchange as well as on load means a vendor can paste the link into a tab
   that is already running and land in the right place. */
function routeHash(){
  const h=location.hash;
  if(h.startsWith('#guest')){
    const pid=h.split('/')[1];
    if(!S.onboarded) loadDemo();
    guestCtx={name:'',email:'',title:'',body:'',trade:'',urgency:'normal',propId:pid||S.activeProp};
    view='guest'; return true;
  }
  if(h.startsWith('#walk/')){
    // Vendor-facing checklist: no sidebar, no account, straight to the work.
    // A bad id is passed through unchanged so the page can say "not found"
    // rather than quietly handing this vendor someone else's walkthrough.
    if(!S.onboarded) loadDemo();
    S.activeWalk=h.split('/')[1]||null;
    view='vendorwalk'; return true;
  }
  return false;
}
routeHash();
window.addEventListener('hashchange',()=>{ if(routeHash()) render() });

/* Boot is async now, because "is anyone signed in?" is a question only Supabase
   can answer and it has to read and possibly refresh a token first. Render once
   immediately so the page is never blank, then again once the answer is back. */
render();

(async function boot(){
  if(!supa){ toast('Could not load the accounts library. Check your connection.','bad',8000); return }
  const {data}=await supa.auth.getSession();
  session=data.session||null;

  /* Fires on sign-in, sign-out and every silent token refresh, including in
     another tab. Keeping our copy in step with it means a session that expires
     while the tab sits open shows the login screen instead of failing writes. */
  supa.auth.onAuthStateChange((_evt,s)=>{
    session=s||null;
    if(!session&&!['landing','auth','guest','vendorwalk'].includes(view)){ view='auth'; render() }
  });

  authReady=true;
  /* A signed-in owner should never land on the marketing page. Guest and vendor
     link views are left alone — those are where they were sent on purpose. */
  if(session&&!['guest','vendorwalk'].includes(view)){
    view=S.onboarded?'dash':'wizard';
    if(view==='wizard'&&!wizDraft){ wizDraft=newDraft(); wizStep=0 }
  }
  render();
})();
